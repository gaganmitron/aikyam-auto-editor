[project]
name = "aikyam-video"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "faster-whisper==1.1.1", "scenedetect==0.6.7.1", "opencv-python-headless==4.10.0.84",
  "numpy>=1.26", "pydantic>=2.6", "jsonschema==4.25.1", "fastapi==0.128.8", "uvicorn==0.39.0",
  "python-multipart==0.0.20", "regex==2026.1.15", "prometheus-client==0.26.0", "boto3==1.42.97",
  "requests>=2.31", "scipy==1.13.1", "pyloudnorm==0.1.1", "confluent-kafka==2.5.3", "anthropic==0.125.0", "sqlalchemy==2.0.36", "psycopg[binary]==3.2.3",
]
[project.optional-dependencies]
clip = ["open_clip_torch==2.29.0", "torch==2.5.1", "torchvision==0.20.1", "transformers==4.46.3", "sentencepiece==0.2.2"]
dev = ["pytest==8.4.2", "httpx==0.28.1"]
[project.scripts]
aikyam-video = "aikyam_video.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["aikyam_video"]
[tool.setuptools.package-data]
aikyam_video = ["data/*.json", "assets/*.png"]
[tool.pytest.ini_options]
testpaths = ["tests"]
